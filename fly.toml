# Fly.io configuration for Predictions app
# Run `fly launch` to create the app, then `fly deploy` to deploy

app = "predictions-app"
primary_region = "arn"  # Stockholm — change to your preferred region

[build]

[env]
  NODE_ENV = "production"
  PORT = "3001"

[mounts]
  source = "predictions_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
